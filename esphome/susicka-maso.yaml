# Sušička na maso: XIAO ESP32S3 + HTU21D + 1-2x 4-pin PWM fan.
# Copy this file and secrets.yaml into your ESPHome config directory,
# packages are downloaded from GitHub. Pinout: docs/zapojeni.md

substitutions:
  device_name: susicka-maso
  friendly_name: "Sušička na maso"
  i2c_sda: GPIO5   # D4
  i2c_scl: GPIO6   # D5
  # "false" = PWM wire directly on GPIO, "true" = through N-MOSFET (docs/zapojeni.md)
  fan_pwm_inverted: "false"

packages:
  susicka:
    url: https://github.com/KinDR007/esphome-susicka-maso
    ref: main
    refresh: 1d
    files:
      - esphome/packages/base.yaml
      - esphome/packages/htu21d.yaml
      - esphome/packages/control.yaml
      - esphome/packages/runtime.yaml
      - esphome/packages/profiles.yaml
      - path: esphome/packages/fan.yaml
        vars:
          fan_id: fan1
          fan_name: "Ventilátor 1"
          pwm_pin: GPIO1   # D0
          tach_pin: GPIO2  # D1
      # Second fan, remove this block when only one fan is used
      - path: esphome/packages/fan.yaml
        vars:
          fan_id: fan2
          fan_name: "Ventilátor 2"
          pwm_pin: GPIO7   # D8
          tach_pin: GPIO8  # D9
