# Profile guide shown by the on-device web UI (and mirrored in homeassistant/dashboard_v2.yaml).
# Order and stages must match esphome/packages/profiles.yaml, scripts/check_dashboard.py verifies it.
# stages: [hours, RH, band, duty min, duty max, Tmax, T lo, T hi, RH lo, RH hi, name, action]

profiles:
  - name: Vlastní
    level: libovolná
    about: Profil se nepoužije, sušička reguluje podle hodnot v sekci Nastavení regulace. Pro vlastní recepty a pokusy.
    meat: libovolné
    room: libovolné, hodnoty nastavíš sám
    prep: podle receptu
    done: podle receptu, nejlépe vážením (úbytek hmotnosti)
    tip: Délku programu nastav ručně v sekci Nastavení regulace.
    stages: []
  - name: Biltong teplý
    level: začátečník
    about: Jihoafrické sušené hovězí v proužcích, nakládané v octu se solí a koriandrem. Nejrychlejší profil, hotovo do týdne.
    meat: hovězí kýta nebo zvěřina, proužky 2–3 cm silné, krájené po vláknech
    room: teplá místnost 20–30 °C, suchý vzduch pod 50 %; sušička netopí, teplota je daná místností
    prep: naložit do octa, soli a koření na 12–24 h do lednice, osušit, zavěsit na háčky tak, aby se kusy nedotýkaly
    done: povrch tmavý a pevný, při stisku nepovolí, uvnitř může zůstat růžový; úbytek hmotnosti kolem 50 %
    tip: První den mírnější sušení, aby povrch nezatvrdl dřív, než vyschne vnitřek. Od 3. dne kontrolovat stiskem.
    stages:
      - [24, 55, 15, 40, 100, 24, 18, 26, 30, 70, Náběh, null]
      - [96, 50, 15, 40, 100, 33, 20, 35, 25, 60, Sušení, null]
  - name: Biltong / droëwors tradiční
    level: začátečník
    about: Biltong nebo droëwors (tenké klobásky) sušené pomaleji v chladnější místnosti. Nejjistější volba pro první pokus.
    meat: hovězí kýta v proužcích 2–3 cm, nebo droëwors v tenkém střívku
    room: byt, chodba nebo sklep 12–22 °C, ideálně 15–20 °C, vlhkost vzduchu pod 65 %
    prep: biltong jako u teplé varianty; droëwors naplnit, zavěsit ve smyčkách
    done: pevné, ne tvrdé; droëwors bývá hotové dřív (3–4 dny)
    tip: Droëwors kontrolovat od 3. dne, program lze ukončit tlačítkem Stop.
    stages:
      - [144, 65, 10, 30, 80, 20, 12, 22, 45, 80, Sušení, null]
  - name: Bresaola
    level: středně pokročilý
    about: Italská sušená hovězí svalovina z celého kusu. Pomalé sušení v chladu po dobu několika týdnů.
    meat: hovězí ořech nebo kýta v celku, bez blan a tuku
    room: sklep nebo chladná místnost 10–16 °C, vlhkost vzduchu 65–80 %; vlhčí vzduch sušička nesníží
    prep: naložit do nakládací soli (s dusitanem) a koření, nechat prosolit v lednici podle tloušťky (obvykle 1–2 týdny), opláchnout, osušit, zavěsit v síťce
    done: úbytek hmotnosti 35–40 %, kus vážit na začátku a každý týden; na řezu jednolitě tmavě červený
    tip: Tvrdý suchý okraj znamená příliš rychlé sušení, sniž maximální výkon. Bílá plíseň je v pořádku.
    stages:
      - [168, 80, 8, 15, 60, 15, 10, 16, 70, 90, Náběh, null]
      - [840, 75, 8, 15, 50, 15, 10, 16, 65, 85, Sušení, null]
  - name: Fermentovaný salám (sušení)
    level: pokročilý
    about: Jen sušení a zrání salámů po fermentaci. Samotnou fermentaci (teplo a vysoká vlhkost) sušička neumí, proběhne předem jinde.
    meat: salámy se startovací kulturou a nakládací solí, po fermentaci
    room: sklep 10–16 °C, vlhkost vzduchu 70–90 %
    prep: zfermentovat podle receptu (obvykle 1–3 dny při 20–24 °C a vysoké vlhkosti), pak zavěsit tak, aby se salámy nedotýkaly
    done: úbytek hmotnosti 30–40 %, salám pevný v celém průřezu
    tip: Proudění se v čase snižuje, aby salám nezatvrdl na povrchu. Bílá ušlechtilá plíseň je žádoucí, zelenou nebo černou otřít octem.
    stages:
      - [168, 85, 6, 30, 80, 15, 10, 16, 78, 95, Osychání, null]
      - [336, 80, 6, 20, 60, 15, 10, 16, 70, 88, Sušení, null]
      - [336, 75, 6, 15, 50, 15, 10, 16, 65, 82, Dosoušení, null]
  - name: Bündnerfleisch
    level: pokročilý
    about: Švýcarské sušené hovězí, dlouhé sušení v chladu se třemi lisováními, která dají hranatý tvar a vyrovnají vlhkost v kusu.
    meat: libová hovězí kýta v celých kusech
    room: chladný sklep 8–18 °C, vlhkost vzduchu 60–85 %, stabilní po celé 3 měsíce
    prep: nasolit směsí soli, nakládací soli a koření a nechat v chladu prosolit (několik týdnů), pak zavěsit
    done: úbytek hmotnosti 45–55 %, tmavý pevný kus
    tip: Na konci fází 1–3 dashboard vyžádá lisování (kusy mezi prkna se závažím na den), po něm stisknout Zásah proveden.
    stages:
      - [504, 80, 8, 20, 60, 14, 8, 18, 70, 88, Sušení 1, Lisování 1]
      - [672, 77, 8, 20, 60, 14, 8, 18, 68, 85, Sušení 2, Lisování 2]
      - [672, 75, 8, 15, 50, 14, 8, 18, 65, 85, Sušení 3, Lisování 3]
      - [504, 72, 8, 15, 50, 14, 8, 18, 62, 82, Dosoušení, null]
  - name: Pastırma
    level: středně pokročilý
    about: Turecké sušené hovězí, po sušení obalené kořenící pastou çemen (pískavice, česnek, paprika).
    meat: hovězí roštěná, svíčková nebo kýta, plátky 4–6 cm
    room: prvních 6 dní kolem 15 °C, pak kolem 20 °C (jaro, podzim nebo přesun sušičky)
    prep: nasolit nasucho, nechat v chladu 1–2 dny, opláchnout a zavěsit
    done: pevné na řezu, po nanesení çemenu ještě 10 dní dosoušet
    tip: Ruční kroky dashboard vyžádá na konci fází (2× lisování, pak çemen na 1 den v lednici). Program mezitím běží dál.
    stages:
      - [144, 80, 8, 20, 70, 16, 12, 18, 70, 88, Sušení 15 °C, Lisování]
      - [120, 70, 10, 25, 80, 21, 16, 23, 60, 80, Sušení 20 °C, Lisování]
      - [120, 70, 10, 25, 80, 21, 16, 23, 60, 80, Sušení 20 °C, Nanést çemen (1 den v lednici)]
      - [240, 70, 10, 25, 80, 21, 16, 23, 60, 80, Dosoušení, null]
  - name: Lonza / lomo (vepřová pečeně)
    level: začátečník
    about: Italská lonza nebo španělské lomo, sušená vepřová pečeně v celku. Libové maso schne rovnoměrně, nejsnazší vepřový profil.
    meat: vepřová pečeně (karé bez kosti) v celku, bez blan, tuk na povrchu může zůstat; maso z jatek s veterinární kontrolou
    room: sklep nebo chladná místnost 10–16 °C, vlhkost vzduchu 70–85 %
    prep: osolit nakládací solí (s dusitanem) a kořením, vakuovat a nechat v lednici prosolit podle tloušťky (obvykle 1–3 týdny), opláchnout, osušit, navléct do síťky nebo střeva, zvážit
    done: úbytek hmotnosti 30–35 %, pevné v celém průřezu; vážit na začátku a každý týden
    tip: Prvních 7 dní vyšší cílová vlhkost, aby povrch nezatvrdl. Bílá plíseň je v pořádku, zelenou otřít octem.
    stages:
      - [168, 82, 6, 15, 60, 15, 10, 17, 75, 90, Náběh, null]
      - [1008, 77, 6, 15, 50, 15, 10, 16, 70, 85, Sušení, null]
  - name: Coppa (krkovice)
    level: středně pokročilý
    about: Italská coppa (capocollo), sušená vepřová krkovice v celku. Prorostlá tukem, schne pomaleji než pečeně a je šťavnatější.
    meat: vepřová krkovice v celku bez kosti; maso z jatek s veterinární kontrolou
    room: sklep nebo chladná místnost 10–16 °C, vlhkost vzduchu 70–85 %
    prep: osolit nakládací solí a kořením, vakuovat a nechat v lednici prosolit podle tloušťky (obvykle 2–3 týdny), opláchnout, pevně navléct do střeva nebo stáhnout síťkou, zvážit
    done: úbytek hmotnosti 30–35 %, na řezu jednolitá barva bez tmavého okraje; obvykle 8–12 týdnů podle tloušťky
    tip: Tlustý kus schne nerovnoměrně, proto vysoká vlhkost na začátku a nižší proudění na konci. Pokud kus ještě není hotový, program prodluž.
    stages:
      - [168, 82, 6, 15, 60, 15, 10, 17, 75, 90, Náběh, null]
      - [1008, 78, 6, 15, 50, 15, 10, 16, 70, 86, Sušení, null]
      - [504, 75, 6, 15, 45, 15, 10, 16, 68, 82, Dosoušení, null]
  - name: Pancetta / guanciale
    level: začátečník
    about: Sušený vepřový bůček (pancetta) nebo lalok (guanciale). Hodně tuku, vaří se z něj (carbonara, amatriciana), krájí se i syrový.
    meat: vepřový bůček bez kůže a kostí, nebo vepřový lalok; maso z jatek s veterinární kontrolou
    room: chladná místnost nebo sklep 10–16 °C, vlhkost vzduchu 60–80 %
    prep: osolit nakládací solí, pepřem a kořením, v sáčku 1–2 týdny v lednici (obracet), opláchnout, osušit, pancettu svinout a převázat nebo nechat plochou, zavěsit
    done: úbytek hmotnosti 25–30 %, libové části pevné; tuk ztrácí vodu pomalu, proto nižší cíl než u libového masa
    tip: Pod 60 % vlhkosti hrozí zatvrdnutí povrchu. Plochý bůček je hotový dřív než svinutý.
    stages:
      - [72, 78, 8, 20, 60, 15, 10, 16, 68, 88, Náběh, null]
      - [768, 72, 8, 15, 50, 15, 10, 16, 60, 80, Sušení, null]
  - name: Speck (kýta)
    level: pokročilý
    about: Tyrolský speck, vepřová kýta nasolená, studeně uzená a dlouho zrající. Uzení probíhá mimo sušičku, dashboard ho vyžádá po osychání.
    meat: vepřová kýta bez kosti, ořech nebo šál v celku, s kůží nebo tukem na jedné straně; maso z jatek s veterinární kontrolou
    room: chladný sklep 10–16 °C, vlhkost vzduchu 65–85 %, stabilní po celé 3 měsíce
    prep: nasolit nakládací solí, pepřem, jalovcem, česnekem a bobkovým listem, 2–3 týdny v chladu v sáčku (obracet), opláchnout, zavěsit do sušičky
    done: úbytek hmotnosti 30–35 %; originální Speck Alto Adige IGP zraje nejméně 22 týdnů, menší kusy doma dříve
    tip: Po 7 dnech osychání vyžádá zásah studené uzení. Udit kouřem do 20 °C, několik dní střídavě s větráním, pak vrátit do sušičky a stisknout Zásah proveden.
    stages:
      - [168, 80, 8, 20, 60, 15, 10, 16, 70, 88, Osychání, Studené uzení (max. 20 °C)]
      - [2184, 75, 8, 15, 50, 15, 10, 16, 65, 85, Zrání, null]

note: Hodnoty jsou orientační z receptů a studií, ne ověřené limity bezpečnosti potravin. Hotovost rozhoduje úbytek hmotnosti, ne uplynulá doba. Vepřové sušit jen s veterinární kontrolou na trichinely (maso z jatek); z domácí porážky nechat vyšetřit, nebo kusy do 15 cm zmrazit na 20 dní při −15 °C.
