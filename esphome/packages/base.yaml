# Base platform: Seeed XIAO ESP32S3, WiFi, API, OTA, web server, diagnostics.
# Requires substitutions: device_name, friendly_name
# Requires secrets: wifi_ssid, wifi_password, hotspot_pass, api_key, ota_pass,
#                   web_username, web_password

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: kindr007.susicka-maso
    version: "1.0.0"

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_pass

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} fallback"
    password: !secret hotspot_pass

captive_portal:

web_server:
  port: 80
  version: 3
  auth:
    username: !secret web_username
    password: !secret web_password

# On-board user LED (GPIO21, active low)
status_led:
  pin:
    number: GPIO21
    inverted: true

sensor:
  - platform: wifi_signal
    name: "WiFi signál"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Doba běhu"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: config
