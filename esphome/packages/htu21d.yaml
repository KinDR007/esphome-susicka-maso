# HTU21D temperature and humidity sensor on I2C (address 0x40).
# Requires substitutions: i2c_sda, i2c_scl
# Provides ids: dryer_temperature, dryer_humidity
# Both sensors publish NaN when no valid reading arrives for 60 s,
# the control package switches to fallback duty in that case.

i2c:
  id: i2c_bus
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  frequency: 100kHz
  scan: true

sensor:
  - platform: htu21d
    i2c_id: i2c_bus
    model: HTU21D
    update_interval: 10s
    temperature:
      id: dryer_temperature
      name: "Teplota"
      filters:
        - timeout: 60s
    humidity:
      id: dryer_humidity
      name: "Vlhkost"
      filters:
        - timeout: 60s

# Watchdog: a sensor that fails during setup is never retried by ESPHome.
# Without a valid humidity reading for sensor_reboot_timeout the device reboots.
# The timeout doubles after each unsuccessful reboot (max 6 h) to avoid a reboot
# loop when the sensor is missing; it resets with the first valid reading.
substitutions:
  sensor_reboot_timeout: "600"

globals:
  - id: sensor_reboots
    type: uint8_t
    restore_value: true
    initial_value: "0"

script:
  - id: sensor_reboot
    mode: single
    then:
      - lambda: |-
          id(sensor_reboots) += 1;
          ESP_LOGE("htu21d", "No valid reading, rebooting (attempt %u)", id(sensor_reboots));
      # let the restored global reach flash before reboot
      - delay: 2s
      - lambda: App.safe_reboot();

interval:
  - interval: 60s
    then:
      - lambda: |-
          static uint32_t last_ok = 0;
          if (!std::isnan(id(dryer_humidity).state)) {
            last_ok = millis();
            if (id(sensor_reboots) != 0)
              id(sensor_reboots) = 0;
            return;
          }
          const uint32_t shift = std::min<uint32_t>(id(sensor_reboots), 6);
          const uint32_t timeout_s = std::min<uint32_t>(${sensor_reboot_timeout}u << shift, 21600u);
          if (millis() - last_ok >= timeout_s * 1000u && !id(sensor_reboot).is_running())
            id(sensor_reboot).execute();
